# Builds + pushes Infisical's backend and redis images, then bumps the image
# tags in the Helm chart's values.yaml and commits that change onto the
# tracked branch — ArgoCD picks up the new commit and redeploys. This is the
# whole GitOps loop: this workflow never touches the cluster directly.
#
# Triggered by a version tag (infisical-v1.2.3), not by every push to the
# Dockerfile — creating the tag is the deliberate "release this" moment.
name: Build and push Infisical images

on:
  push:
    tags:
      - "infisical-v*"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: vars
        run: echo "version=${GITHUB_REF_NAME#infisical-v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/infisical/Dockerfile
          push: true
          tags: lbriza/homeport:infisical-backend-v${{ steps.vars.outputs.version }}

      - name: Build and push redis image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/infisical/Dockerfile.redis
          push: true
          tags: lbriza/homeport:infisical-redis-v${{ steps.vars.outputs.version }}

      - name: Bump image tags in Helm values
        run: |
          sed -i "s/tag: infisical-backend-.*/tag: infisical-backend-v${{ steps.vars.outputs.version }}/" core/infisical/k8s/chart/values.yaml
          sed -i "s/tag: infisical-redis-.*/tag: infisical-redis-v${{ steps.vars.outputs.version }}/" core/infisical/k8s/chart/values.yaml

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A tag checkout leaves us in detached HEAD — switch to the branch
          # ArgoCD actually tracks before committing the bump.
          git fetch origin master
          git checkout master
          git add core/infisical/k8s/chart/values.yaml
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: bump infisical images to v${{ steps.vars.outputs.version }}"
          # Branch may have moved since checkout (someone pushing manually
          # mid-build) — rebase onto the latest before pushing, retrying a
          # couple times in case of a tight race.
          for i in 1 2 3; do
            git push origin master && break
            echo "push rejected, rebasing onto latest and retrying ($i/3)"
            git fetch origin master
            git rebase origin/master
            sleep 2
          done
