{{- if not .Values.infisical.enabled }}
# Manual secret — used only when infisical.enabled is false. When true, this same
# object (name/key) is created and owned by the InfisicalStaticSecret template instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  FTLCONF_webserver_api_password: {{ .Values.adminToken | quote }}
{{- end }}
