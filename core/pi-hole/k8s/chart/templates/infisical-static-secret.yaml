{{- if .Values.infisical.enabled }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Release.Name }}-secrets-sync
  namespace: {{ .Release.Namespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisical.authRef.name }}
    namespace: {{ .Values.infisical.authRef.namespace }}
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: {{ .Values.infisical.projectId | quote }}
      environmentSlug: {{ .Values.infisical.environmentSlug }}
      secretPath: {{ .Values.infisical.secretPath }}
  targets:
    - name: {{ .Release.Name }}-secrets
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      # Note: the double-brace expression inside the backticks below is NOT
      # evaluated by Helm — Helm just prints it as literal text. It's evaluated
      # later, by the Infisical operator itself, against whatever it fetched
      # from your Infisical project. Key name already matches the container's
      # env var 1:1 (unlike vaultwarden's ADMIN_TOKEN), no renaming needed.
      template:
        engineVersion: v1
        data:
          FTLCONF_webserver_api_password: "{{`{{ .FTLCONF_webserver_api_password.Value }}`}}"
{{- end }}
