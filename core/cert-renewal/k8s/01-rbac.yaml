apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-renewal
  namespace: cert-renewal
---
# Cluster-wide on purpose: certs are issued for Ingresses spread across every
# app namespace (headlamp, legacy-proxy, vaultwarden, ...), not just this one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-renewal
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-renewal
subjects:
  - kind: ServiceAccount
    name: cert-renewal
    namespace: cert-renewal
roleRef:
  kind: ClusterRole
  name: cert-renewal
  apiGroup: rbac.authorization.k8s.io
