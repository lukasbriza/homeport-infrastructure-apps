# Rendered once per namespace in .Values.namespaces — see values.yaml for why
# this can't just be a single shared ConfigMap. The
# "http.keda.sh/response-body: true" label is required by the KEDA HTTP
# Add-on; without it, InterceptorRoutes referencing this ConfigMap by name are
# refused.
{{- range .Values.namespaces }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coldstart-page
  namespace: {{ . }}
  labels:
    http.keda.sh/response-body: "true"
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="cs">
    <head>
      <meta charset="UTF-8">
      <meta http-equiv="refresh" content="3">
      <title>Spouští se…</title>
      <style>
        html, body { height: 100%; margin: 0; }
        body {
          display: flex; align-items: center; justify-content: center;
          font-family: system-ui, -apple-system, sans-serif;
          background: #0f172a; color: #e2e8f0;
        }
        .box { text-align: center; padding: 0 20px; }
        .spinner {
          width: 48px; height: 48px; margin: 0 auto 20px;
          border: 4px solid rgba(226,232,240,0.2);
          border-top-color: #38bdf8;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 1.1rem; font-weight: 500; margin: 0 0 6px; }
        p { font-size: 0.85rem; color: #94a3b8; margin: 0; }
      </style>
    </head>
    <body>
      <div class="box">
        <div class="spinner"></div>
        <h1>Aplikace se probouzí&hellip;</h1>
        <p>Tohle může trvat pár desítek vteřin. Stránka se sama obnoví.</p>
      </div>
    </body>
    </html>
{{- end }}
