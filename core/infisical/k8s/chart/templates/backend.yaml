apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      containers:
        - name: infisical-backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: SITE_URL
              value: {{ .Values.siteUrl | quote }}
            - name: POSTGRES_USER
              value: infisical
            - name: POSTGRES_DB
              value: infisical
            - name: REDIS_URL
              value: "redis://{{ .Release.Name }}-redis:6379"
            # $(POSTGRES_PASSWORD) below is Kubernetes' own env-var
            # interpolation (works because POSTGRES_PASSWORD is defined
            # earlier in this same list) — not a Helm/shell expansion.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            - name: DB_CONNECTION_URI
              value: "postgres://infisical:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgres:5432/infisical"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: ENCRYPTION_KEY
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: AUTH_SECRET
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
