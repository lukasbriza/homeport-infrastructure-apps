# ArgoCD Application for donetick (homeport-personal-apps repo). Deploys only on
# a tag push (donetick-v*) — see .github/workflows/donetick-deploy.yml, which
# triggers `argocd app sync`. donetick has no build step of its own (runs the
# upstream donetick/donetick image directly), so the tag carries no version —
# it's purely the "deploy now" signal. Auto-sync/self-heal are intentionally
# off so nothing deploys except on that trigger.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: donetick
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: master
    path: apps/donetick/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: donetick
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
