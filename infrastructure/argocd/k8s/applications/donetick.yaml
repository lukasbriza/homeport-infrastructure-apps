# ArgoCD Application for donetick (homeport-personal-apps repo). Deliberately NOT
# auto-syncing yet — sync manually (`argocd app sync donetick` or via the UI) until
# the flow is validated. Once confirmed, add:
#   syncPolicy:
#     automated:
#       prune: true
#       selfHeal: true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: donetick
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: master
    path: apps/donetick/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: donetick
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
