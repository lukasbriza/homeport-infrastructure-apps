# ArgoCD Application for donetick (homeport-personal-apps repo). Auto-sync is on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: donetick
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: master
    path: apps/donetick/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: donetick
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
