# ArgoCD Application for vaultwarden (homeport-personal-apps repo). Deploys only
# on a tag push (vaultwarden-v*) — see .github/workflows/vaultwarden-deploy.yml,
# which triggers `argocd app sync`. vaultwarden has no build step of its own (runs
# the upstream vaultwarden/server image directly), so the tag carries no version —
# it's purely the "deploy now" signal. Auto-sync/self-heal are intentionally off
# so nothing deploys except on that trigger.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: master
    path: apps/vaultwarden/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
