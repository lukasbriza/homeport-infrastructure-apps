# ArgoCD Application for vaultwarden (homeport-personal-apps repo). Deliberately NOT
# auto-syncing yet — this is the first GitOps-managed app, so sync manually
# (`argocd app sync vaultwarden` or via the UI) until the flow is validated.
# Once confirmed, add:
#   syncPolicy:
#     automated:
#       prune: true
#       selfHeal: true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: master
    path: apps/vaultwarden/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
