# ArgoCD Application for seafile (homeport-personal-apps repo). Auto-sync is
# on — the manual-sync validation period is done (deployed, MariaDB data
# migrated via mysqldump/mysql restore, files migrated via rsync, verified
# live on seafile.lukasbriza.eu with real libraries).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seafile
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: master
    path: apps/seafile/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: seafile
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
