# ArgoCD Application for seafile (homeport-personal-apps repo). Deploys only on a
# tag push (seafile-v*) — see .github/workflows/seafile-deploy.yml, which
# triggers `argocd app sync`. seafile has no build step of its own (runs the
# upstream seafileltd/seafile-mc image directly), so the tag carries no
# version — it's purely the "deploy now" signal. Auto-sync/self-heal are
# intentionally off so nothing deploys except on that trigger.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seafile
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: master
    path: apps/seafile/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: seafile
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
