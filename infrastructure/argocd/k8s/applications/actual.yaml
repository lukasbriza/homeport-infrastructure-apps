# ArgoCD Application for actual (homeport-personal-apps repo). Auto-sync is
# on — the manual-sync validation period is done (deployed, data migrated via
# rsync, verified live on budgetmanager.lukasbriza.eu with real budget data).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actual
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: master
    path: apps/actual/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: actual
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
