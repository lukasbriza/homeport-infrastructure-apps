# ArgoCD Application for headlamp — now a local chart in this repo
# (infrastructure/headlamp/k8s/chart) wrapping the upstream headlamp/headlamp
# chart as a dependency, same pattern as every app in homeport-personal-apps.
# Deploys only via a manual `argocd app sync headlamp` until confirmed
# working (no `automated` block) — add one once validated, per "Adding a new
# app to ArgoCD" in DEPLOYMENT.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-infrastructure-apps.git
    targetRevision: master
    path: infrastructure/headlamp/k8s/chart
    helm:
      valueFiles: [values.yaml, values-prod.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    syncOptions: [CreateNamespace=true]
