# ArgoCD Application for wishlist (homeport-personal-apps repo). Deploys only on
# a tag push (wishlist-v*) — see .github/workflows/wishlist-deploy.yml, which
# triggers `argocd app sync`. wishlist has no build step of its own (runs the
# upstream ghcr.io/cmintey/wishlist image directly), so the tag carries no
# version — it's purely the "deploy now" signal. Auto-sync/self-heal are
# intentionally off so nothing deploys except on that trigger.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wishlist
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: master
    path: apps/wishlist/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: wishlist
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
