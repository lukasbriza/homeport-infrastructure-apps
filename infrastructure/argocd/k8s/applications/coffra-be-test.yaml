# ArgoCD Application for coffra-be, test environment (coffra-app repo). Deploys only through
# the coffra-be-test-v* tag, whose workflow ends with `argocd app sync`; automated sync stays off.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coffra-be-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/coffra-app.git
    targetRevision: master
    path: apps/coffra-be/k8s/chart
    helm:
      releaseName: coffra-be
      valueFiles:
        - values.yaml
        - values-test.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: coffra-be-test
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
