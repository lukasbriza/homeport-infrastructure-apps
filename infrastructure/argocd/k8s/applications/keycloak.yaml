# ArgoCD Application for keycloak (homeport-personal-apps repo). Auto-sync is
# on — the manual-sync validation period is done (deployed, Postgres data
# migrated via pg_dump/pg_restore, verified live on auth.lukasbriza.eu with
# real realm/user data).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: master
    path: apps/keycloak/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
