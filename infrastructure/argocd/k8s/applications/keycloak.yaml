# ArgoCD Application for keycloak (homeport-personal-apps repo). Deploys only on
# a tag push (keycloak-v*) — the same tag that triggers
# .github/workflows/keycloak-build-push.yml, which builds+pushes the image,
# bumps values.yaml, and (as its last step) runs `argocd app sync`.
# Auto-sync/self-heal are intentionally off so nothing deploys except through
# that release tag.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: master
    path: apps/keycloak/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
