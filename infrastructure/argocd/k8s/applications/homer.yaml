# ArgoCD Application for homer (homeport-personal-apps repo). Auto-sync is on —
# the manual-sync validation period is done (deployed, data migrated, verified
# live on lukasbriza.eu).
#
# targetRevision points at feat/kubernetes-migration because that's the only
# branch with these manifests right now. Update it once this work lands on
# master (or whatever the long-term branch turns out to be).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasbriza/homeport-personal-apps.git
    targetRevision: feat/kubernetes-migration
    path: apps/homer/k8s/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
