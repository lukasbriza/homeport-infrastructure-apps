# Scale-to-zero for headlamp — see this repo's DEPLOYMENT.md, "Opting an app
# into scale-to-zero". Targets the Deployment/Service the upstream
# headlamp/headlamp chart creates (named "headlamp", matching the Helm release
# name it's installed under). Requires KEDA + the HTTP Add-on already installed
# (core/keda). Replace <domain> below with the same host used in 00-ingress.yaml.
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  target:
    service: headlamp
    port: 80
  # A rule without `paths` only matches the literal root ("/"), not the app as
  # a whole — the explicit "/" prefix below is required to cover every path.
  rules:
    - hosts: ["<domain>"]
      paths:
        - value: /
  # Shown to users while this pod is cold-starting instead of a bare "no
  # endpoints" error. The ConfigMap itself is rendered by core/coldstart-page
  # in this same repo — headlamp just needs to be listed in that chart's
  # values-prod.yaml, or this reference resolves to nothing.
  coldStart:
    placeholder:
      response:
        bodyFromConfigMap:
          name: coldstart-page
          key: index.html
        headers:
          Refresh: "3"
  scalingMetric:
    requestRate:
      targetValue: 5
      window: 1m
      granularity: 1s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: headlamp
  namespace: headlamp
spec:
  scaleTargetRef:
    name: headlamp
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: headlamp
